publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  audioplayers: ^6.5.0
flutter:
