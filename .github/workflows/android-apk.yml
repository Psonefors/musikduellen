name: Bygg Musikduellen APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Ordna projektfiler
        run: |
          mkdir -p lib assets/audio assets/web
          cp main.dart game.dart lib/
          cp player.html assets/web/
          cp suspense.wav demo1.wav demo2.wav demo3.wav assets/audio/

      - name: Skapa Android-projekt
        run: flutter create --project-name musikduellen --platforms android --no-pub .

      - name: Android-behörigheter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace(
              '<application',
              '<uses-permission android:name="android.permission.INTERNET" />\n'
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
              '<application android:usesCleartextTraffic="true"',
              1
          )
          p.write_text(s)
          PY

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Musikduellen-APK
          path: build/app/outputs/flutter-apk/app-release.apk
