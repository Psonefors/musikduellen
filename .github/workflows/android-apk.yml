
name: Bygg Musikduellen APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Skapa projektmappar
        run: |
          mkdir -p lib assets/audio assets/web
          cp main.dart game.dart lib/
          cp player.html assets/web/
          cp suspense.wav demo1.wav demo2.wav demo3.wav assets/audio/

      - name: Skapa Android-projekt
        run: |
          flutter create --project-name musikduellen --platforms android --no-pub .

      - name: Återställ och rätta spelkoden
        run: |
          cp main.dart game.dart lib/

          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace('if(wager)', 'if(wagering)')
          p.write_text(s)

          p = Path('lib/game.dart')
          s = p.read_text()
          s = s.replace(
              'if (available.isEmpty)',
              'if (catalog.every((s) => used.contains(s.audioUrl)))'
          )
          p.write_text(s)

          assert 'if(wager)' not in Path('lib/main.dart').read_text()
          assert 'if (available.isEmpty)' not in Path('lib/game.dart').read_text()
          PY

          rm -f analysis_options.yaml
          rm -rf test

      - name: Android-behörigheter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace(
              '<application',
              '<uses-permission android:name="android.permission.INTERNET" />\n'
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
              '<application android:usesCleartextTraffic="true"',
              1
          )
          p.write_text(s)
          PY

      - name: Hämta Flutter-paket
        run: flutter pub get

      - name: Kontrollera koden
        run: flutter analyze lib--no-fatal-infos --no-fatal-warnings

      - name: Bygg Android APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Musikduellen-APK
          path: build/app/outputs/flutter-apk/app-release.apk
